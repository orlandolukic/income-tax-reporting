<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Izveštavanje o porezu na dobit</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      // Key must match STORAGE_KEY in src/context/ThemeProvider.tsx.
      try {
        // Light or dark; without a stored choice, the operating system's one (no "system" mode).
        var t = localStorage.getItem("ui-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
